      y: 1.26
      width: 26.12
      height: 3.89
  - id: 1
    type: textBox
    text: "Neural Networks: Models inspired by the structure of the human brain, consisting of interconnected nodes that process and learn from data.  \nDeep Neural Networks: Neural networks with multiple hidden layers that can learn increasingly complex and abstract features.  \nBackpropagation: A learning process that adjusts the network’s weights based on prediction errors, allowing the model to improve over time."
    role: body-text
