  - id: 1
    type: textBox
    text: 'Deep learning is a branch of artificial intelligence.

      It enables computers to learn from data and improve over time without writing explicit rules for each task.

      Instead of hand-coding, developers feed data into a system that discovers patterns and makes its own decisions or guesses precisely.'
    role: body-text
