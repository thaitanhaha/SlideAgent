      height: 6.36
    data:
    - Types: Supervised learning
      Properties: Uses data that already has the correct answers (labels) to teach the system how to predict outcomes for new data.
      Year: 1950s
    - Types: Unsupervised learning
      Properties: Looks at data without any labels to find hidden groups or patterns on its own.
      Year: 1960s
    - Types: Reinforcement learning
      Properties: Learns by trial and error, getting rewards for good moves and penalties for bad ones
      Year: 1980s
    _original_idx: 3
