      height: 3.89
  - id: 1
    type: textBox
    text: 'Deep learning uses multi‑layer neural networks to learn.

      Instead of hand‑crafting features, these models automatically discover patterns from raw data and improve.

      It excels at image, audio, and text tasks, handling complex data with high accuracy, robustness, and broad applicability and more.'
    role: body-text
    layout:
      x: 3.06
      y: 3.92
      width: 24.85
      height: 5.38
  - id: 3
    type: textBox
    text: Main types of deep learning
    role: caption
    layout:
      x: 11.75
      y: 16.95
      width: 10.36
      height: 1.03
  - id: 2
    type: table
    role: table
    layout:
      x: 1.79
      y: 10.38
      width: 29.09
      height: 6.36
    data:
    - Types: Convolutional Neural Networks (CNNs)
      Properties: Process grid data like images and video by detecting spatial patterns, edges, and textures
      Year: 1979
    - Types: Recurrent Neural Networks (RNNs)
      Properties: Handle sequential data like time series or speech by maintaining a hidden memory state over time
      Year: 1982
    - Types: Long Short-Term Memory (LSTM)
      Properties: An advanced type of RNN designed to remember long-term dependencies and avoid memory loss
      Year: 1997
    - Types: Transformer Networks
      Properties: Use self-attention mechanisms to process words and long text sequences in parallel, powering modern large language models
      Year: 2017
